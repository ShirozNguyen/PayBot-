# ==============================================================================
#                                PAYBOT++ CONFIG
#                   Plugin Mở Rộng Mốc Nạp Cá Nhân & Toàn Server
# ==============================================================================
# Tự động đồng bộ thông tin nạp từ PayBot và PlaceholderAPI.
# Hỗ trợ tự động kết nối CSDL chung với PayBot (MySQL hoặc SQLite local).
# ------------------------------------------------------------------------------

# Bật chế độ quét định kỳ (mặc định: false -> Dùng cơ chế Event-Driven 0ms delay, tối ưu 100% CPU)
enable-periodic-sync: false

# Tần số kiểm tra đồng bộ (chỉ áp dụng khi enable-periodic-sync = true)
sync-interval-seconds: 10

# Các biến thay thế (Placeholder) có thể dùng trong câu lệnh reward:
#   [playername] / %player% -> Tên người chơi nhận thưởng
#   [amount] / %amount%     -> Số tiền nạp hoặc giá trị mốc nạp
#   [player_total]          -> Tổng số tiền nạp cá nhân của người chơi
#   [server_total]          -> Tổng số tiền nạp của toàn bộ server
#   [milestone]             -> Mốc nạp đạt được

# ==============================================================================
# 1. MỐC NẠP CÁ NHÂN (SINGLE MILESTONES)
# Khi từng người chơi nạp đạt mốc chỉ định, tự động thực thi danh sách lệnh.
# ==============================================================================
single-milestones:
  "1000000":
    cmds:
      - "give [playername] diamond 10"
      - "broadcast &a[PayBot++] Người chơi &e[playername] &ađã đạt mốc nạp cá nhân &b1.000.000 VNĐ!"
  "5000000":
    cmds:
      - "give [playername] netherite_ingot 5"
      - "broadcast &a[PayBot++] Người chơi &e[playername] &ađã đạt mốc nạp cá nhân &b5.000.000 VNĐ!"

# ==============================================================================
# 2. MỐC NẠP TOÀN SERVER (GLOBAL MILESTONES)
# Khi tổng số tiền toàn bộ server nạp chạm mốc, tự động trao thưởng cho TẤT CẢ
# người chơi đã từng tham gia server. Người chơi offline sẽ nhận khi đăng nhập lại!
# ==============================================================================
global-milestones:
  "10000000":
    cmds:
      - "broadcast &6&l[PAYBOT++] TOÀN SERVER ĐÃ ĐẠT MỐC NẠP 10.000.000 VNĐ!"
      - "give [playername] emerald 10"
      - "msg [playername] &aBạn nhận được phần thưởng mốc nạp toàn server 10M!"
  "50000000":
    cmds:
      - "broadcast &6&l[PAYBOT++] TOÀN SERVER ĐÃ ĐẠT MỐC NẠP 50.000.000 VNĐ!"
      - "give [playername] netherite_block 1"
      - "msg [playername] &aBạn nhận được phần thưởng mốc nạp toàn server 50M!"
